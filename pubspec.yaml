name: reading_exercise
description: "Duolingo-style reading exercise."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - assets/audio/sentences/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/reading_girl.png"